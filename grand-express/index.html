<!doctype html>
<meta charset="utf-8">
<title>World Express has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://t29mato.github.io/world-express/">
<meta http-equiv="refresh" content="3; url=/world-express/">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #241a3f; color: #f6efe2;
    font-family: system-ui, "Helvetica Neue", Arial, sans-serif;
    text-align: center; padding: 24px;
  }
  .box { max-width: 30rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { line-height: 1.6; color: #cfc4b0; margin: 0 0 1rem; }
  a.go {
    display: inline-block; margin-top: 0.5rem; padding: 12px 22px;
    background: #f5b31c; color: #241a3f; font-weight: 800;
    border-radius: 10px; text-decoration: none;
  }
  code { color: #f5b31c; }
</style>
<div class="box">
  <h1>World Express has moved</h1>
  <p>
    The game now lives at <code>/world-express/</code>. Taking you there in a moment —
    or follow the link if nothing happens.
  </p>
  <p>Your saved games are not affected.</p>
  <a class="go" href="/world-express/">Go to World Express</a>
</div>
<script>
  /*
   * Anyone arriving here from a bookmark just gets redirected.
   *
   * Anyone who added the OLD address to their home screen is a harder case:
   * their device still has the old service worker, which serves the old app
   * from its cache and never reaches this page. The kill-switch worker at
   * ./sw.js takes care of that — but only once the browser fetches it, which
   * it does on navigation. Registering it here covers the case where the old
   * worker has already been removed but the path is still bookmarked.
   */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/grand-express/sw.js", { scope: "/grand-express/" }).catch(function () {});
  }
  setTimeout(function () { location.replace("/world-express/"); }, 2500);
</script>
