<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altiplano Express — A Bolivian Rail Fortune Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#241a3f;
  --night2:#1b1330;
  --panel:#2f2455;
  --panel2:#3a2d66;
  --line:#4a3b7d;
  --salt:#f6efe2;
  --salt-dim:#cfc4b0;
  --pink:#e8447a;
  --gold:#f5b31c;
  --teal:#37b3a4;
  --green:#7bc86c;
  --red:#e05252;
  --blue:#5b8fe8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Archivo',system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at 70% -10%, #35276360 0%, transparent 60%),
    var(--night);
  color:var(--salt);
  min-height:100vh;
  display:flex;flex-direction:column;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ── Aguayo ribbon header ─────────────────────────── */
header{
  border-bottom:6px solid transparent;
  border-image:repeating-linear-gradient(90deg,
    var(--pink) 0 26px, var(--gold) 26px 52px, var(--teal) 52px 78px,
    #8a5cd6 78px 104px, var(--green) 104px 130px) 1;
  background:var(--night2);
  padding:10px 20px 12px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.wiphala{display:grid;grid-template-columns:repeat(4,9px);grid-auto-rows:9px;transform:rotate(45deg);flex:none}
.wiphala i{display:block}
h1{
  font-family:'Alfa Slab One',serif;font-weight:400;
  font-size:clamp(1.3rem,3.2vw,2rem);letter-spacing:.02em;
  color:var(--gold);text-shadow:3px 3px 0 #00000055;line-height:1;
}
h1 small{display:block;font-family:'Archivo';font-weight:600;font-size:.72rem;letter-spacing:.28em;color:var(--salt-dim);text-transform:uppercase;margin-top:4px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:.85rem;color:var(--salt-dim)}
.year-chip{background:var(--panel2);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-weight:800;color:var(--salt)}
.year-chip b{color:var(--gold)}

/* ── Layout ───────────────────────────────────────── */
main{flex:1;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,430px);gap:16px;padding:16px;max-width:1500px;width:100%;margin:0 auto}
@media (max-width:900px){ main{grid-template-columns:1fr} }

.board-wrap{
  background:linear-gradient(180deg,#2a1f4d,#221840);
  border:1px solid var(--line);border-radius:18px;padding:8px;position:relative;
  box-shadow:0 20px 50px #00000050, inset 0 0 80px #00000030;
}
.board-wrap::after{ /* woven corner accent */
  content:"";position:absolute;top:14px;right:14px;width:70px;height:10px;border-radius:3px;
  background:repeating-linear-gradient(90deg,var(--pink) 0 10px,var(--gold) 10px 20px,var(--teal) 20px 30px,#8a5cd6 30px 40px,var(--green) 40px 50px);
  opacity:.85;
}
svg#board{width:100%;height:auto;display:block}

/* board text */
.city-label{font-family:'Archivo';font-weight:800;font-size:15px;fill:var(--salt);paint-order:stroke;stroke:#1b1330;stroke-width:4px;letter-spacing:.02em}
.node-sym{font-size:13px;font-weight:800;fill:#1b1330;pointer-events:none}
.legend{font-size:12px;fill:var(--salt-dim)}

.node{transition:transform .15s}
.node.choosable{cursor:pointer}
.node.choosable .halo{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25;r:16}50%{opacity:.8;r:22}}
.dest-ring{animation:destspin 3s linear infinite;transform-origin:center}
@keyframes destspin{to{transform:rotate(360deg)}}
.token{transition:transform .24s ease}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ── Sidebar ──────────────────────────────────────── */
aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px #00000035}
.card h2{font-family:'Alfa Slab One';font-weight:400;font-size:.82rem;letter-spacing:.14em;color:var(--salt-dim);text-transform:uppercase;margin-bottom:10px}

.dest-card{background:linear-gradient(135deg,#3a2d66,#2f2455);position:relative;overflow:hidden}
.dest-card .wiphala{position:absolute;right:-14px;top:-14px;opacity:.5}
.dest-city{font-family:'Alfa Slab One';font-size:1.7rem;color:var(--gold);line-height:1.05}
.dest-tag{color:var(--salt-dim);font-size:.85rem;margin-top:4px}
.dest-bonus{margin-top:10px;display:inline-block;background:#f5b31c22;border:1px dashed var(--gold);color:var(--gold);font-weight:800;padding:5px 12px;border-radius:8px;font-size:.9rem}

.turn-row{display:flex;align-items:center;gap:14px}
#die{
  width:76px;height:76px;border-radius:16px;border:none;flex:none;
  background:var(--salt);color:var(--night2);font-size:3rem;line-height:1;
  font-family:'Alfa Slab One';display:grid;place-items:center;
  box-shadow:0 6px 0 #b9ad97, 0 14px 24px #00000045;
  transition:transform .1s;
}
#die:not(:disabled):hover{transform:translateY(-2px)}
#die:disabled{opacity:.55;cursor:default;box-shadow:0 3px 0 #b9ad97}
#die.rolling{animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.turn-info{min-width:0}
.turn-name{font-weight:800;font-size:1.05rem}
.turn-hint{color:var(--salt-dim);font-size:.83rem;margin-top:2px}

.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.9rem}
.prow.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 18px #f5b31c33}
.pdot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #1b1330}
.pname{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .cpu-tag{font-size:.65rem;background:#00000040;padding:2px 6px;border-radius:5px;color:var(--salt-dim);margin-left:6px;vertical-align:1px}
.pname .tio{font-size:.95rem;margin-left:4px}
.pcash{font-weight:800;color:var(--green)}
.pprops{color:var(--salt-dim);font-size:.78rem}

#log{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;font-size:.83rem;scrollbar-width:thin}
#log p{border-left:3px solid var(--line);padding-left:8px;color:var(--salt-dim)}
#log p b{color:var(--salt)}
#log p.good{border-color:var(--green)} #log p.bad{border-color:var(--red)}
#log p.gold{border-color:var(--gold);color:var(--salt)}

/* ── City art ─────────────────────────────────────── */
.art{width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#1b1330;margin-bottom:14px;box-shadow:0 10px 26px #00000055;line-height:0}
.art svg{display:block;width:100%;height:auto}
.dest-thumb{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-top:12px;line-height:0;position:relative;z-index:1}
.dest-thumb svg{display:block;width:100%;height:auto}
#musicBtn{min-width:104px}
#musicBtn.off{color:var(--salt-dim);opacity:.75}

/* ── Modal ────────────────────────────────────────── */
#overlay{position:fixed;inset:0;background:#120c24cc;backdrop-filter:blur(3px);display:none;place-items:center;padding:18px;z-index:50}
#overlay.show{display:grid}
.modal{
  width:min(560px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:22px 24px;box-shadow:0 30px 80px #000000aa;position:relative;
  border-top:6px solid transparent;
  border-image:repeating-linear-gradient(90deg,var(--pink) 0 22px,var(--gold) 22px 44px,var(--teal) 44px 66px,#8a5cd6 66px 88px,var(--green) 88px 110px) 1;
  animation:pop .18s ease;
  max-height:88vh;overflow-y:auto;
}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal .eyebrow{font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--salt-dim);font-weight:800;margin-bottom:6px}
.modal h3{font-family:'Alfa Slab One';font-weight:400;font-size:1.5rem;color:var(--gold);line-height:1.1;margin-bottom:10px}
.modal p{color:var(--salt);line-height:1.55;font-size:.95rem}
.modal .fact{background:#00000030;border-left:4px solid var(--teal);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:12px;font-size:.9rem;color:var(--salt-dim)}
.modal .fact b{color:var(--teal)}
.btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{
  border:none;border-radius:10px;padding:11px 18px;font-weight:800;font-size:.95rem;
  background:var(--gold);color:var(--night2);box-shadow:0 4px 0 #b8850f;transition:transform .1s;
}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--panel2);color:var(--salt);box-shadow:0 4px 0 #221840;border:1px solid var(--line)}
.btn.opt{width:100%;text-align:left;background:var(--panel2);color:var(--salt);box-shadow:none;border:1px solid var(--line)}
.btn.opt:hover{border-color:var(--gold)}
.btn.opt.correct{background:#7bc86c33;border-color:var(--green);color:var(--green)}
.btn.opt.wrong{background:#e0525233;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.7;cursor:default;transform:none}
.money{color:var(--green);font-weight:800}
.money.neg{color:var(--red)}

/* setup */
.slot{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slot input{flex:1;background:var(--night2);border:1px solid var(--line);border-radius:8px;color:var(--salt);padding:9px 12px;font-family:inherit;font-size:.9rem;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--night2);color:var(--salt-dim);border:none;padding:9px 12px;font-weight:800;font-size:.8rem}
.seg button.on{background:var(--gold);color:var(--night2)}
.rules{font-size:.85rem;color:var(--salt-dim);line-height:1.6;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.rules b{color:var(--salt)}
.rank{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:8px}
.rank .pos{font-family:'Alfa Slab One';font-size:1.3rem;color:var(--salt-dim);width:34px}
.rank.first{border-color:var(--gold);box-shadow:0 0 20px #f5b31c33}
.rank.first .pos{color:var(--gold)}
footer{padding:10px 20px 16px;text-align:center;color:#7a6da8;font-size:.75rem}
</style>
</head>
<body>

<header>
  <div class="wiphala" id="wiphala-hdr" aria-hidden="true"></div>
  <h1>ALTIPLANO EXPRESS<small>A Bolivian rail fortune game · learn as you ride</small></h1>
  <div class="hdr-right">
    <span class="year-chip">Year <b id="yearNow">1</b> / <span id="yearMax">12</span></span>
    <button class="btn ghost" id="musicBtn" style="padding:7px 14px;font-size:.8rem">♪ Music on</button>
    <button class="btn ghost" id="newGameBtn" style="padding:7px 14px;font-size:.8rem">New game</button>
  </div>
</header>

<main>
  <div class="board-wrap">
    <svg id="board" viewBox="0 0 760 830" role="img" aria-label="Rail map of Bolivia"></svg>
  </div>

  <aside>
    <div class="card dest-card">
      <div class="wiphala" id="wiphala-dest" aria-hidden="true"></div>
      <h2>Next destination</h2>
      <div class="dest-city" id="destName">—</div>
      <div class="dest-tag" id="destTag"></div>
      <div class="dest-bonus">First arrival: <span id="destBonus">Bs 0</span></div>
      <div class="dest-thumb" id="destThumb"></div>
    </div>

    <div class="card">
      <h2>Turn</h2>
      <div class="turn-row">
        <button id="die" aria-label="Roll the die">⚄</button>
        <div class="turn-info">
          <div class="turn-name" id="turnName">—</div>
          <div class="turn-hint" id="turnHint">Press the die to roll.</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Travelers</h2>
      <div class="players" id="playersBox"></div>
    </div>

    <div class="card" style="flex:1;min-height:120px">
      <h2>Travel log</h2>
      <div id="log" aria-live="polite"></div>
    </div>
  </aside>
</main>

<footer>Distances, prices and rails are playfully simplified — the history is real. ¡Buen viaje!</footer>

<div id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modalBox"></div></div>

const Snd=(()=>{
  let ctx=null,master,musicG,sfxG,dly,noiseBuf,on=true,running=false,step=0,nextT=0,loopTimer=null;
  const BPM=100, STEP=(60/BPM)/4;
  const CH=[
    {b:110,n:[220,261.63,329.63]},{b:98,n:[196,246.94,293.66]},
    {b:87.31,n:[174.61,220,261.63]},{b:98,n:[196,246.94,293.66]},
    {b:110,n:[220,261.63,329.63]},{b:130.81,n:[261.63,329.63,392]},
    {b:98,n:[196,246.94,293.66]},{b:110,n:[220,261.63,329.63]},
  ];
  const MEL=[
    [[0,440,4],[4,523.25,4],[8,659.25,6],[14,587.33,2]],
    [[0,523.25,4],[4,587.33,2],[6,523.25,2],[8,392,8]],
    [[0,523.25,4],[4,440,4],[8,523.25,4],[12,587.33,4]],
    [[0,659.25,6],[6,587.33,2],[8,523.25,8]],
    [[0,659.25,2],[2,783.99,2],[4,659.25,4],[8,587.33,4],[12,523.25,4]],
    [[0,587.33,4],[4,659.25,4],[8,783.99,8]],
    [[0,440,4],[4,523.25,4],[8,392,6],[14,440,2]],
    [[0,523.25,4],[4,440,4],[8,220,8]],
  ];
  const STRUM=[0,3,4,6,8,11,12,14], DRUM=[[0,1],[6,.55],[8,.9],[11,.4],[14,.6]];

  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=0.85; master.connect(ctx.destination);
    musicG=ctx.createGain(); musicG.gain.value=0; musicG.connect(master);
    sfxG=ctx.createGain(); sfxG.gain.value=0.5; sfxG.connect(master);
    dly=ctx.createDelay(1); dly.delayTime.value=0.30;
    const fb=ctx.createGain(); fb.gain.value=0.30; dly.connect(fb); fb.connect(dly);
    const dw=ctx.createGain(); dw.gain.value=0.34; dly.connect(dw); dw.connect(musicG);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.6,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const noise=(t,dur,freq,q,vol,out)=>{
    const s=ctx.createBufferSource(); s.buffer=noiseBuf;
    const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=q;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(out||sfxG); s.start(t); s.stop(t+dur+0.02);
  };
  function flute(t,freq,dur,vol,out){
    out=out||musicG;
    const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(freq,t);
    const o2=ctx.createOscillator(); o2.type="triangle"; o2.frequency.setValueAtTime(freq*2,t);
    const g=ctx.createGain(), g2=ctx.createGain(); g2.gain.value=0.11;
    const lfo=ctx.createOscillator(); lfo.frequency.value=5.1;
    const lg=ctx.createGain(); lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(freq*0.009,t+dur*0.5);
    lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    o.connect(g); o2.connect(g2); g2.connect(g);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.055);
    g.gain.setValueAtTime(vol,t+dur*0.62);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.08);
    g.connect(out); if(out===musicG) g.connect(dly);
    noise(t,0.09,freq*1.6,1.2,vol*0.5,out);
    o.start(t); o2.start(t); lfo.start(t);
    o.stop(t+dur+0.2); o2.stop(t+dur+0.2); lfo.stop(t+dur+0.2);
  }
  function pluck(t,freq,vol,out){
    out=out||musicG;
    const o=ctx.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(freq,t);
    const o2=ctx.createOscillator(); o2.type="sawtooth"; o2.frequency.setValueAtTime(freq,t); o2.detune.value=9;
    const f=ctx.createBiquadFilter(); f.type="lowpass";
    f.frequency.setValueAtTime(4200,t); f.frequency.exponentialRampToValueAtTime(700,t+0.3);

    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(out);
    o.start(t); o2.start(t); o.stop(t+0.5); o2.stop(t+0.5);
  }
  function bombo(t,vol){
    const o=ctx.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(155,t); o.frequency.exponentialRampToValueAtTime(46,t+0.13);
    const g=ctx.createGain(); g.gain.setValueAtTime(vol*0.6,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.33);

  }
  function bass(t,freq,dur){
    const o=ctx.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(freq,t);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(musicG); o.start(t); o.stop(t+dur+0.05);
  }
  function schedule(){
    if(!ctx) return;
    while(nextT < ctx.currentTime+0.15){
      const bar=Math.floor(step/16)%8, s=step%16, ch=CH[bar];
      if(s===0||s===8) bass(nextT,ch.b/2,0.6);
      if(s===12) bass(nextT,ch.b*0.75,0.3);
      const dr=DRUM.find(d=>d[0]===s); if(dr) bombo(nextT,dr[1]);
      if(STRUM.indexOf(s)>=0){
        const k=STRUM.indexOf(s);
        pluck(nextT,ch.n[k%3],0.075);
        pluck(nextT+0.012,ch.n[(k+1)%3]*2,0.05);

    musicG.gain.cancelScheduledValues(ctx.currentTime);
    musicG.gain.setTargetAtTime(on?0.42:0,ctx.currentTime,0.8);
  }
  function toggle(){
    on=!on; init();
    if(ctx) musicG.gain.setTargetAtTime(on?0.42:0,ctx.currentTime,0.25);
    return on;
  }
  const T=()=>ctx?ctx.currentTime:0;
  return {
    start, toggle, isOn:()=>on, ready:()=>!!ctx,
    tick(){ if(!ctx)return; noise(T(),0.035,2400,3,0.28); },
    step(){ if(!ctx)return; pluck(T(),660,0.10,sfxG); },
    coin(){ if(!ctx)return; const t=T(); flute(t,880,0.11,0.16,sfxG); flute(t+0.09,1174.66,0.2,0.16,sfxG); },
    hit(){ if(!ctx)return; const t=T(); noise(t,0.35,180,0.7,0.5); flute(t,196,0.22,0.14,sfxG); flute(t+0.12,164.81,0.3,0.13,sfxG); },
    buy(){ if(!ctx)return; const t=T(); [523.25,659.25,880].forEach((f,i)=>pluck(t+i*0.05,f,0.14,sfxG)); },
    right(){ if(!ctx)return; const t=T(); [523.25,659.25,783.99,1046.5].forEach((f,i)=>flute(t+i*0.08,f,0.22,0.14,sfxG)); },
    wrong(){ if(!ctx)return; const t=T();
      const o=ctx.createOscillator(); o.type="square"; o.frequency.setValueAtTime(196,t);
      o.frequency.exponentialRampToValueAtTime(92,t+0.34);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.36);
      o.connect(g); g.connect(sfxG); o.start(t); o.stop(t+0.4); },
    tio(){ if(!ctx)return; const t=T();
      [58,87,116].forEach(f=>{ const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(f,t);
        o.frequency.linearRampToValueAtTime(f*0.86,t+0.9);
        const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.07,t+0.12);
        g.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
        const f2=ctx.createBiquadFilter(); f2.type="lowpass"; f2.frequency.value=420;
        o.connect(f2); f2.connect(g); g.connect(sfxG); o.start(t); o.stop(t+1.1); });

    fanfare(){ if(!ctx)return; const t=T();

      [0,.14,.28,.42,.62,.76].forEach(d=>bombo(t+d,0.8)); },
  };

const nodes={}, adj={};
for(const id in CITIES){ nodes[id]={id,type:"city",...CITIES[id]}; adj[id]=[]; }
EDGES.forEach(([a,b,n],ei)=>{
  const A=CITIES[a],B=CITIES[b], chain=[a];
  for(let k=1;k<=n;k++){
    const t=k/(n+1), id=`e${ei}_${k}`;
    const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy);
    const jitter=((ei*7+k*13)%5-2)*4;
    const x=A.x+dx*t+(-dy/len)*jitter, y=A.y+dy*t+(dx/len)*jitter;
    const pat=["blue","event","red"], type=pat[(ei*2+k)%3];
    const node={id,type,x,y};
    if(type==="blue") node.val=50+((ei+k)%4)*25;
    if(type==="red")  node.val=40+((ei+k)%3)*25;
    nodes[id]=node; adj[id]=[]; chain.push(id);
  }
  chain.push(b);
  for(let i=0;i<chain.length-1;i++){ adj[chain[i]].push(chain[i+1]); adj[chain[i+1]].push(chain[i]); }
});
function bfsDist(from,to){
  if(from===to) return 0;
  const seen={[from]:0}, q=[from];
  while(q.length){ const c=q.shift();
    for(const nb of adj[c]){ if(seen[nb]===undefined){ seen[nb]=seen[c]+1; if(nb===to) return seen[nb]; q.push(nb);} } }
  return 999;
}

      el("circle",{class:"dest-ring",cx:nd.x,cy:nd.y,r:20,fill:"none",stroke:"#f5b31c",'stroke-width':"3",'stroke-dasharray':"6 7",opacity:"0",id:"ring_"+id,style:`transform-origin:${nd.x}px ${nd.y}px`},g);
      const lbl=el("text",{class:"city-label",x:nd.x+(nd.lx??16),y:nd.y+(nd.ly??5)},g);
      lbl.textContent=nd.n;
      el("circle",{cx:nd.x,cy:nd.y,r:9,fill:"#f5b31c",opacity:"0",id:"own_"+id,'pointer-events':"none"},g);
    }else{
      const col=nd.type==="blue"?"#5b8fe8":nd.type==="red"?"#e05252":"#f5b31c";
      el("rect",{x:nd.x-9,y:nd.y-9,width:18,height:18,rx:5,fill:col,stroke:"#1b1330",'stroke-width':"2.5"},g);
      const t=el("text",{class:"node-sym",x:nd.x,y:nd.y+4.5,'text-anchor':"middle"},g);
      t.textContent=nd.type==="blue"?"+":nd.type==="red"?"−":"?";
    }
  }
  // manual label nudges for crowded areas
  tweakLabel("copacabana",-104,-14); tweakLabel("elalto",-72,-12); tweakLabel("lapaz",14,-8);
  tweakLabel("oruro",-64,6); tweakLabel("uyuni",-62,10); tweakLabel("potosi",14,14);
  tweakLabel("villazon",-40,24); tweakLabel("psuarez",-52,-16); tweakLabel("cobija",-18,-16);
  tweakLabel("riberalta",12,-12); tweakLabel("sucre",16,-2); tweakLabel("tarija",16,6);
  // legend
  const lg=el("g",{transform:"translate(492,700)"});
  const items=[["#5b8fe8","+","Gain money"],["#e05252","−","Lose money"],["#f5b31c","?","Bolivia quiz"],["#f6efe2","","Station"]];
  items.forEach((it,i)=>{
    const y=i*26;
    if(it[1]==="") el("circle",{cx:9,cy:y+9,r:8,fill:it[0],stroke:"#1b1330",'stroke-width':"2"},lg);
    else el("rect",{x:1,y:y+1,width:16,height:16,rx:4,fill:it[0],stroke:"#1b1330",'stroke-width':"2"},lg);
    const t=el("text",{x:26,y:y+13,class:"legend"},lg); t.textContent=it[2];
  });
  el("g",{id:"tokensG"});
}
function tweakLabel(id,dx,dy){
  const g=boardEl.querySelector(`[data-id="${id}"] .city-label`);
  if(g){ g.setAttribute("x",nodes[id].x+dx); g.setAttribute("y",nodes[id].y+dy); }
}
function renderTokens(){
  const g=boardEl.querySelector("#tokensG"); g.innerHTML="";
  const offs=[[-10,-11],[10,-11],[-10,11],[10,11]];
  players.forEach((p,i)=>{
    const nd=nodes[p.node], [ox,oy]=offs[i];
    const t=document.createElementNS(SVG_NS,"g");
    t.setAttribute("class","token");
    t.setAttribute("style",`transform:translate(${nd.x+ox}px,${nd.y+oy}px)`);
    const c=document.createElementNS(SVG_NS,"circle");
    c.setAttribute("r","9.5"); c.setAttribute("fill",p.color); c.setAttribute("stroke","#1b1330"); c.setAttribute("stroke-width","2.5");
    t.appendChild(c);
    const tx=document.createElementNS(SVG_NS,"text");
    tx.setAttribute("text-anchor","middle"); tx.setAttribute("y","4"); tx.setAttribute("font-size","10");
    tx.textContent = (tioHolder===i && tioIntroduced) ? "👹" : "🚂";
    t.appendChild(tx);
    g.appendChild(t);
  });
}
function markDest(){
  document.querySelectorAll("[id^=ring_]").forEach(r=>r.setAttribute("opacity","0"));
  if(dest) document.getElementById("ring_"+dest).setAttribute("opacity","1");
}
function markOwned(){
  for(const id in CITIES){
    const owner=players.find(p=>p.props.includes(id));
    const dot=document.getElementById("own_"+id);
    if(owner){ dot.setAttribute("opacity","1"); dot.setAttribute("fill",owner.color); dot.setAttribute("r","5.5"); dot.setAttribute("cy",nodes[id].y); dot.setAttribute("cx",nodes[id].x); }
    else dot.setAttribute("opacity","0");
  }
}

/* ═══════════ UI ═══════════ */
function buildWiphala(elId,size){
  const w=document.getElementById(elId); w.innerHTML="";
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const i=document.createElement("i");

    w.appendChild(i);
  }
}
buildWiphala("wiphala-hdr"); buildWiphala("wiphala-dest");

const logEl=document.getElementById("log");
function log(html,cls=""){ const p=document.createElement("p"); if(cls)p.className=cls; p.innerHTML=html; logEl.prepend(p); }
function refreshPlayers(){
  const box=document.getElementById("playersBox"); box.innerHTML="";
  players.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="prow"+(i===turnIdx&&!over?" active":"");
    const inc=p.props.reduce((s,id)=>s+CITIES[id].prop.inc,0);
    d.innerHTML=`<span class="pdot" style="background:${p.color}"></span>
      <span class="pname">${p.name}${p.cpu?'<span class="cpu-tag">CPU</span>':""}${(tioHolder===i&&tioIntroduced)?'<span class="tio" title="El Tío rides this train">👹</span>':""}
      <div class="pprops">${p.props.length} propert${p.props.length===1?"y":"ies"} · +${fmt(inc)}/yr</div></span>
      <span class="pcash">${fmt(p.cash)}</span>`;
    box.appendChild(d);
  });
  document.getElementById("yearNow").textContent=year;
  document.getElementById("yearMax").textContent=maxYears;
}
function setDestCard(){
  const c=CITIES[dest];
  document.getElementById("destName").textContent=c.n.toUpperCase();
  document.getElementById("destTag").textContent=c.tag;
  document.getElementById("destBonus").textContent=fmt(destBonus());
  document.getElementById("destThumb").innerHTML=cityArt(dest,{bare:true});
}
const destBonus=()=>600+100*year;

/* modal helpers */
const overlay=document.getElementById("overlay"), modalBox=document.getElementById("modalBox");
function showModal(html){ modalBox.innerHTML=html; overlay.classList.add("show"); }
function hideModal(){ overlay.classList.remove("show"); }
function modalOnce(html,btnLabel="Continue"){
  return new Promise(res=>{
    showModal(html+`<div class="btnrow"><button class="btn" id="mOk">${btnLabel}</button></div>`);
    document.getElementById("mOk").onclick=()=>{hideModal();res();};
    document.getElementById("mOk").focus();
  });
}
function autoModal(html,ms){
  showModal(html);
  return sleep(ms).then(hideModal);
}

/* ═══════════ GAME FLOW ═══════════ */
const dieBtn=document.getElementById("die");
function pickDest(fromNode){
  const ids=Object.keys(CITIES).filter(id=>id!==fromNode);
  const far=ids.filter(id=>players.every(p=>bfsDist(p.node,id)>=5));
  const pool=far.length?far:ids;
  return pool[rnd(pool.length)];
}
function drawQuiz(){ if(!quizBag.length) quizBag=[...QUIZ].sort(()=>Math.random()-.5); return quizBag.pop(); }

async function startGame(cfg){
  players=cfg.players.map((s,i)=>({name:s.name,cpu:s.cpu,color:P_COLORS[i],cash:1000,props:[],node:"lapaz",prev:null}));
  maxYears=cfg.years; year=1; turnIdx=0; tioHolder=-1; tioIntroduced=false; over=false; quizBag=[];
  logEl.innerHTML="";
  dest=pickDest("lapaz");
  drawBoard(); renderTokens(); markDest(); markOwned(); setDestCard(); refreshPlayers();
  log(`All aboard at <b>La Paz</b>! First destination: <b>${CITIES[dest].n}</b>.`,"gold");
  await modalOnce(`
    <div class="art">${cityArt("lapaz")}</div>
    <div class="eyebrow">All aboard</div><h3>Departure: La Paz</h3>
    <p>Every traveler starts with <span class="money">${fmt(1000)}</span> at 3,600 m above the sea.
    Race to <b>${CITIES[dest].n}</b> — first arrival earns <span class="money">${fmt(destBonus())}</span>, then a new destination is drawn.</p>
    <div class="fact"><b>Tip:</b> Land exactly on a station to read its story and buy its business. Businesses pay income every year — richest traveler after ${maxYears} years wins.</div>`,"Depart!");
  gameLoop();
}

async function gameLoop(){
  while(!over){
    await playTurn();
    if(over)break;
    turnIdx++;
    if(turnIdx>=players.length){
      turnIdx=0; year++;
      if(year>maxYears){ endGame(); return; }
      // yearly income
      let any=false;
      players.forEach(p=>{
        const inc=p.props.reduce((s,id)=>s+CITIES[id].prop.inc,0);
        if(inc>0){ p.cash+=inc; any=true; log(`<b>${p.name}</b> collects <span style="color:var(--green)">+${fmt(inc)}</span> in yearly income.`,"good"); }
      });
      log(`— Year ${year} begins —`,"gold");
      if(any) refreshPlayers();
      setDestCard();
    }
    refreshPlayers();
  }
}

async function playTurn(){
  const p=players[turnIdx];
  refreshPlayers();
  document.getElementById("turnName").textContent=`${p.name}'s turn`;
  document.getElementById("turnHint").textContent=p.cpu?"Thinking…":"Press the die to roll.";
  // El Tío drains
  if(tioIntroduced && tioHolder===turnIdx){
    const d=60+rnd(101);
    p.cash=Math.max(0,p.cash-d);
    Snd.tio();
    log(`👹 ${TIO_LINES[rnd(TIO_LINES.length)]} <b>${p.name}</b> loses <span style="color:var(--red)">−${fmt(d)}</span>.`,"bad");
    refreshPlayers();
  }
  // roll
  let r;
  if(p.cpu){ dieBtn.disabled=true; await sleep(700); r=await animateRoll(); }
  else{
    dieBtn.disabled=false;
    await new Promise(res=>{ dieBtn.onclick=async()=>{ dieBtn.disabled=true; r=await animateRoll(); res(); }; });
  }
  log(`<b>${p.name}</b> rolls a <b>${r}</b>.`);
  document.getElementById("turnHint").textContent=`Moving ${r}…`;
  // move
  for(let s=0;s<r;s++){
    let opts=adj[p.node].filter(x=>x!==p.prev);
    if(!opts.length) opts=[...adj[p.node]];
    let next;
    if(opts.length===1) next=opts[0];
    else if(p.cpu){ opts.sort((a,b)=>bfsDist(a,dest)-bfsDist(b,dest)); next=opts[0]; }
    else next=await humanChoose(opts);
    p.prev=p.node; p.node=next;
    renderTokens(); Snd.step();
    await sleep(240);
  }
  await land(p);
}

function animateRoll(){
  return new Promise(res=>{
    dieBtn.classList.add("rolling");
    const faces="⚀⚁⚂⚃⚄⚅"; let t=0;
    const iv=setInterval(()=>{ dieBtn.textContent=faces[rnd(6)]; Snd.tick(); if(++t>7){ clearInterval(iv); const r=1+rnd(6); dieBtn.textContent=faces[r-1]; dieBtn.classList.remove("rolling"); Snd.coin(); res(r);} },70);
  });
}
function humanChoose(opts){
  document.getElementById("turnHint").textContent="Fork in the rails — tap a glowing square.";
  return new Promise(res=>{
    const gs=opts.map(id=>boardEl.querySelector(`[data-id="${id}"]`));
    gs.forEach(g=>{ g.classList.add("choosable"); g.querySelector(".halo").setAttribute("opacity","0.6");
      g.onclick=()=>{ cleanup(); res(g.dataset.id); };
      g.setAttribute("tabindex","0");
      g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();cleanup();res(g.dataset.id);} };
    });
    function cleanup(){ gs.forEach(g=>{ g.classList.remove("choosable"); g.querySelector(".halo").setAttribute("opacity","0"); g.onclick=null; g.onkeydown=null; g.setAttribute("tabindex","-1"); }); }
  });
}

async function land(p){
  const nd=nodes[p.node];
  if(nd.type==="blue"){
    p.cash+=nd.val; Snd.coin();
    log(`<b>${p.name}</b> earns <span style="color:var(--green)">+${fmt(nd.val)}</span> hauling freight.`,"good");
  }else if(nd.type==="red"){
    const v=Math.min(nd.val,p.cash);
    p.cash-=v; Snd.hit();
    log(`<b>${p.name}</b> hits a landslide on the pass: <span style="color:var(--red)">−${fmt(v)}</span>.`,"bad");
  }else if(nd.type==="event"){
    await quizStop(p);
  }else if(nd.type==="city"){
    if(p.node===dest) await arriveDest(p);
    else await cityStop(p);
  }
  refreshPlayers(); markOwned();
}

async function quizStop(p){
  const q=drawQuiz();
  const shuffled=q.o.map((t,i)=>({t,ok:i===q.a})).sort(()=>Math.random()-.5);
  if(p.cpu){
    const pickOk=Math.random()<0.65;
    const pick=pickOk?shuffled.find(o=>o.ok):shuffled.find(o=>!o.ok);
    const delta=pickOk?150:-50;
    p.cash=Math.max(0,p.cash+delta);
    pickOk?Snd.right():Snd.wrong();
    await autoModal(`
      <div class="eyebrow">Bolivia quiz · ${p.name} (CPU)</div><h3>${q.q}</h3>
      <p>${p.name} answers: <b>“${pick.t}”</b> — ${pickOk?'<span class="money">correct! +'+fmt(150)+'</span>':'<span class="money neg">wrong. −'+fmt(50)+'</span>'}</p>
      <div class="fact"><b>Did you know?</b> ${q.f}</div>`,2600);
    log(`❓ <b>${p.name}</b> ${pickOk?"aces":"fumbles"} a quiz (${pickOk?"+":"−"}${pickOk?fmt(150):fmt(50)}).`,pickOk?"good":"bad");
  }else{
    await new Promise(res=>{
      showModal(`
        <div class="eyebrow">Bolivia quiz · +${fmt(150)} if correct</div><h3>${q.q}</h3>
        <div class="btnrow" style="flex-direction:column" id="qOpts">
          ${shuffled.map((o,i)=>`<button class="btn opt" data-ok="${o.ok}">${o.t}</button>`).join("")}
        </div>`);
      document.querySelectorAll("#qOpts .opt").forEach(b=>{
        b.onclick=()=>{
          const ok=b.dataset.ok==="true";
          document.querySelectorAll("#qOpts .opt").forEach(x=>{ x.disabled=true; if(x.dataset.ok==="true")x.classList.add("correct"); });
          if(!ok)b.classList.add("wrong");
          ok?Snd.right():Snd.wrong();
          const delta=ok?150:-50; p.cash=Math.max(0,p.cash+delta);
          log(`❓ <b>${p.name}</b> ${ok?"answers correctly (+"+fmt(150)+")":"answers wrong (−"+fmt(50)+")"}.`,ok?"good":"bad");
          const div=document.createElement("div");
          div.innerHTML=`<div class="fact"><b>Did you know?</b> ${q.f}</div><div class="btnrow"><button class="btn" id="qGo">Continue</button></div>`;
          modalBox.appendChild(div);
          document.getElementById("qGo").onclick=()=>{hideModal();res();};
          document.getElementById("qGo").focus();
        };
      });
    });
  }
}

async function cityStop(p){
  const id=p.node, c=CITIES[id];
  const owner=players.find(x=>x.props.includes(id));
  const canBuy=!owner && p.cash>=c.prop.cost;
  const propLine=owner
    ? `<p style="margin-top:10px;color:var(--salt-dim)"><b style="color:${owner.color}">${owner.name}</b> owns the ${c.prop.n} here.</p>`
    : `<p style="margin-top:10px"><b>${c.prop.n}</b> — cost <span class="money neg">${fmt(c.prop.cost)}</span>, pays <span class="money">+${fmt(c.prop.inc)}</span> every year.</p>`;
  if(p.cpu){
    let bought=false;
    if(canBuy && p.cash>=c.prop.cost+150){ p.cash-=c.prop.cost; p.props.push(id); bought=true; }
    if(bought) Snd.buy();
    await autoModal(`
      <div class="art">${cityArt(id)}</div>
      <div class="eyebrow">Station stop · ${p.name} (CPU)</div><h3>${c.n}</h3>
      <p>${c.fact}</p>${propLine}
      ${bought?`<p style="margin-top:8px;color:var(--gold);font-weight:800">${p.name} buys the ${c.prop.n}!</p>`:""}`,2600);
    if(bought) log(`🏪 <b>${p.name}</b> buys the <b>${c.prop.n}</b> in ${c.n} (−${fmt(c.prop.cost)}).`,"gold");
    else log(`<b>${p.name}</b> stops at <b>${c.n}</b>.`);
  }else{
    await new Promise(res=>{
      showModal(`
        <div class="art">${cityArt(id)}</div>
        <div class="eyebrow">Station stop</div><h3>${c.n}</h3>
        <p style="color:var(--salt-dim);font-size:.85rem;margin-bottom:8px">${c.tag}</p>
        <p>${c.fact}</p>${propLine}
        <div class="btnrow">
          ${canBuy?`<button class="btn" id="buyBtn">Buy for ${fmt(c.prop.cost)}</button>`:""}
          <button class="btn ghost" id="passBtn">${canBuy?"Pass":"Continue"}</button>
        </div>`);
      const buy=document.getElementById("buyBtn");
      if(buy) buy.onclick=()=>{ p.cash-=c.prop.cost; p.props.push(id); Snd.buy();
        log(`🏪 <b>${p.name}</b> buys the <b>${c.prop.n}</b> in ${c.n} (−${fmt(c.prop.cost)}).`,"gold");
        hideModal(); res(); };
      document.getElementById("passBtn").onclick=()=>{ log(`<b>${p.name}</b> stops at <b>${c.n}</b>.`); hideModal(); res(); };
      (buy||document.getElementById("passBtn")).focus();
    });
  }
}

async function arriveDest(p){
  const c=CITIES[dest], bonus=destBonus();
  p.cash+=bonus; Snd.fanfare();
  log(`🎯 <b>${p.name}</b> reaches <b>${c.n}</b> first! <span style="color:var(--gold)">+${fmt(bonus)}</span>`,"gold");
  const oldDest=dest;
  dest=pickDest(oldDest);
  // reassign El Tío to farthest from new destination
  let far=-1,fd=-1;
  players.forEach((pl,i)=>{ const d=bfsDist(pl.node,dest); if(d>fd){fd=d;far=i;} });
  const firstTio=!tioIntroduced;
  tioHolder=far; tioIntroduced=true;
  markDest(); setDestCard(); renderTokens();
  const tioMsg = firstTio
    ? `<div class="fact"><b>👹 El Tío boards the rails!</b> In the mines of Potosí, workers honor El Tío — Lord of the Underworld — with cigarettes, coca leaves and alcohol, so he protects rather than punishes. He now rides with <b>${players[far].name}</b>, the traveler farthest from the new destination, demanding offerings each turn.</div>`
    : `<div class="fact">👹 <b>El Tío</b> switches trains — he now rides with <b>${players[far].name}</b>, farthest from ${CITIES[dest].n}.</div>`;
  const html=`
    <div class="art">${cityArt(oldDest)}</div>
    <div class="eyebrow">Destination reached</div><h3>${c.n} — ${fmt(bonus)} prize!</h3>
    <p><b>${p.name}</b> arrives first. ${c.fact}</p>
    <p style="margin-top:10px">🧭 Next destination: <b style="color:var(--gold)">${CITIES[dest].n}</b> — ${CITIES[dest].tag}.</p>
    <div class="art" style="margin:12px 0 0">${cityArt(dest)}</div>
    ${tioMsg}`;
  if(p.cpu) await autoModal(html,3400); else await modalOnce(html,"Full steam ahead");
  log(`🧭 New destination: <b>${CITIES[dest].n}</b>. 👹 El Tío rides with <b>${players[far].name}</b>.`);
}

/* ═══════════ END & SETUP ═══════════ */
function netWorth(p){ return p.cash+p.props.reduce((s,id)=>s+CITIES[id].prop.cost,0); }
function endGame(){
  over=true; dieBtn.disabled=true; Snd.win();
  const ranked=[...players].sort((a,b)=>netWorth(b)-netWorth(a));
  const rows=ranked.map((p,i)=>`
    <div class="rank ${i===0?"first":""}">
      <span class="pos">${i+1}</span>
      <span class="pdot" style="background:${p.color}"></span>
      <span class="pname" style="flex:1">${p.name}${p.cpu?'<span class="cpu-tag">CPU</span>':""}
        <div class="pprops">${p.props.map(id=>CITIES[id].prop.n).join(", ")||"No properties"}</div></span>
      <span class="pcash">${fmt(netWorth(p))}</span>
    </div>`).join("");
  showModal(`
    <div class="eyebrow">End of the line · ${maxYears} years</div>
    <h3>🏆 ${ranked[0].name} wins!</h3>
    <p>Final net worth (cash + properties):</p>${rows}
    <div class="fact">From Titicaca's sacred islands to the lithium beneath Uyuni's salt, you've crossed a country of 36 nations, two capitals and five centuries of history. <b>¡Jallalla Bolivia!</b></div>
    <div class="btnrow"><button class="btn" id="againBtn">Play again</button></div>`);
  document.getElementById("againBtn").onclick=()=>{hideModal();openSetup();};
  log(`🏆 <b>${ranked[0].name}</b> wins with ${fmt(netWorth(ranked[0]))}!`,"gold");
}

      </div>
      <div class="btnrow"><button class="btn" id="startBtn" style="width:100%">Start the journey</button></div>`);
    modalBox.querySelectorAll(".slot input").forEach(inp=>inp.onchange=()=>{slots[+inp.dataset.i].name=inp.value.trim()||("Traveler "+(+inp.dataset.i+1));});
    modalBox.querySelectorAll(".seg[data-i] button").forEach(b=>b.onclick=()=>{
      if(b.disabled)return;
      slots[+b.parentElement.dataset.i].mode=b.dataset.m; render();
    });
    modalBox.querySelectorAll("#yearsSeg button").forEach(b=>b.onclick=()=>{years=+b.dataset.y;render();});
    document.getElementById("startBtn").onclick=()=>{
      const active=slots.filter(s=>s.mode!=="off");
      Snd.start();
      hideModal();
      startGame({years,players:active.map(s=>({name:s.name,cpu:s.mode==="cpu"}))});
    };
  }
  render();
}
document.getElementById("newGameBtn").onclick=()=>{ over=true; openSetup(); };

/* init */
drawBoard(); openSetup();
</script>
</body>
</html>
